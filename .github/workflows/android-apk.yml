name: Android APK

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check for new commits since the last nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Manual runs always build, so a failed nightly can be retried.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No commits since the last nightly ($GITHUB_SHA); skipping the build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Stamp nightly version
        run: |
          base_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$base_version" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts."
            exit 1
          fi
          version="${base_version}-nightly.$(date -u +%Y%m%d)"
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"${version}\"/" app/build.gradle.kts
          grep -Fq "versionCode = ${{ github.run_number }}" app/build.gradle.kts
          grep -Fq "versionName = \"${version}\"" app/build.gradle.kts
          echo "Building ${version} (versionCode ${{ github.run_number }})"

      - name: Build release APK
        run: ./gradlew assembleRelease --build-cache

      # Updates only install over APKs with the same signature, so the debug
      # keystore cannot be used for releases.
      - name: Sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add the release signing secrets first (see README)."
              exit 1
            fi
          done
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          tools=$(ls -d "$sdk"/build-tools/* | sort -V | tail -n 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out yogganstick-nightly.apk \
            "$apk"
          "$tools/apksigner" verify yogganstick-nightly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yogganstick-nightly-apk
          path: yogganstick-nightly.apk
          if-no-files-found: error

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Yogganstick nightly $(date -u +%Y-%m-%d)"
          notes=$(printf 'Built from %s at %s (%s).\nversionCode: %s' \
            "$GITHUB_REF_NAME" "$(date -u '+%Y-%m-%d %H:%M UTC')" "${GITHUB_SHA:0:7}" "${{ github.run_number }}")
          # Recreate the release so its tag always points at the built commit.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly yogganstick-nightly.apk --target "$GITHUB_SHA" --title "$title" --notes "$notes"
